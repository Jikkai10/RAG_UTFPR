services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=true
    entrypoint: >
      bash -c "
        ollama serve &
        sleep 5 &&
        ollama pull llama3.2 &&
        wait
      "
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  neo4j:
    image: neo4j:5
    container_name: neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"  
      - "7687:7687"  
    environment:
      - NEO4J_AUTH=neo4j/12345678
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

  rag_api:
    build: .
    container_name: rag_api
    restart: unless-stopped
    depends_on:
      - neo4j
      - ollama
    ports:
      - "8080:8080"
    environment:
      - OLLAMA_URL=http://ollama:11434
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=12345678
    command: uvicorn api:app --host 0.0.0.0 --port 8080

volumes:
  ollama_data:
  neo4j_data:
  neo4j_logs: